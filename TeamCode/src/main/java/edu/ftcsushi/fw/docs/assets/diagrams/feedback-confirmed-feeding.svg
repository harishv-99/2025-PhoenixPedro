<svg xmlns="http://www.w3.org/2000/svg" width="960" height="465" viewBox="0 0 960 465" role="img" aria-labelledby="title description">
  <title id="title">Sampled evidence permitting and confirming one feed</title>
  <desc id="description">Illustrative times are seconds relative to the release request. Three ready samples before release span the settling interval. At zero, the output realizes release and the staged sensor is still occupied. Later conditioned vacancy supplies departure evidence. Release and transfer command phases must also succeed. Dots represent software samples, not continuous physical motion or a scored shot.</desc>
  <rect width="960" height="465" rx="8" fill="#ffffff"/>
  <g font-family="Arial, sans-serif" fill="#182a3a">
    <text x="24" y="32" font-size="21" font-weight="bold">Which observations allow one feed to finish?</text>
    <text x="24" y="57" font-size="14">Authored illustration, not a recorded run. Dots = sampled facts; bars = command phases.</text>
    <g stroke="#d7dee4" stroke-dasharray="3 5">
      <path d="M230 83V366M293 83V366M356 83V366M419 83V366M482 83V366M545 83V366M608 83V366M671 83V366M734 83V366M797 83V366M860 83V366"/>
    </g>
    <text x="24" y="103" font-size="15" font-weight="bold">Both wheels ready</text>
    <text x="24" y="124" font-size="13">Matching request; fresh</text>
    <g fill="#17516c" stroke="#ffffff" stroke-width="2">
      <circle cx="230" cy="112" r="6"/><circle cx="293" cy="112" r="6"/><circle cx="356" cy="112" r="6"/>
      <circle cx="419" cy="112" r="6"/><circle cx="482" cy="112" r="6"/><circle cx="545" cy="112" r="6"/>
      <circle cx="608" cy="112" r="6"/><circle cx="671" cy="112" r="6"/><circle cx="734" cy="112" r="6"/>
      <circle cx="797" cy="112" r="6"/><circle cx="860" cy="112" r="6"/>
    </g>
    <path d="M230 137v9h126v-9" fill="none" stroke="#17516c" stroke-width="2"/>
    <text x="293" y="166" text-anchor="middle" font-size="13">0.10 s sampled settling</text>
    <text x="24" y="208" font-size="15" font-weight="bold">Conditioned stage</text>
    <text x="24" y="228" font-size="13">First inventory position</text>
    <text x="195" y="188" font-size="12" text-anchor="end">occupied</text>
    <text x="195" y="254" font-size="12" text-anchor="end">vacant</text>
    <g fill="#17516c" stroke="#ffffff" stroke-width="2">
      <circle cx="230" cy="198" r="6"/><circle cx="293" cy="198" r="6"/><circle cx="356" cy="198" r="6"/>
      <circle cx="419" cy="198" r="7"/><circle cx="482" cy="198" r="6"/>
      <circle cx="545" cy="242" r="7"/><circle cx="608" cy="242" r="6"/><circle cx="671" cy="242" r="6"/>
      <circle cx="734" cy="242" r="6"/><circle cx="797" cy="242" r="6"/><circle cx="860" cy="242" r="6"/>
    </g>
    <path d="M419 207v57h126v-13" fill="none" stroke="#17516c" stroke-width="2"/>
    <text x="650" y="281" text-anchor="middle" font-size="13">Occupied after realization, then strictly later vacant</text>
    <text x="24" y="320" font-size="15" font-weight="bold">Requested phase</text>
    <text x="24" y="340" font-size="13">Not measured movement</text>
    <rect x="419" y="304" width="189" height="35" rx="4" fill="#e0eef4" stroke="#17516c"/>
    <text x="513" y="326" text-anchor="middle" font-size="14">Release · 0.15 s</text>
    <rect x="608" y="304" width="252" height="35" rx="4" fill="#f5e8d5" stroke="#705127"/>
    <text x="734" y="326" text-anchor="middle" font-size="14">Transfer · 0.20 s</text>
    <text x="639" y="358" text-anchor="middle" font-size="13">Departure evidence AND successful phases are required</text>
    <path d="M217 375H884l-8 -5m8 5-8 5" fill="none" stroke="#182a3a" stroke-width="2"/>
    <g font-size="12" text-anchor="middle">
      <text x="230" y="396">−0.15</text><text x="293" y="396">−0.10</text><text x="356" y="396">−0.05</text>
      <text x="419" y="396">0.00</text><text x="482" y="396">0.05</text><text x="545" y="396">0.10</text>
      <text x="608" y="396">0.15</text><text x="671" y="396">0.20</text><text x="734" y="396">0.25</text>
      <text x="797" y="396">0.30</text><text x="860" y="396">0.35</text>
    </g>
    <text x="553" y="422" text-anchor="middle" font-size="14">Time relative to release request (seconds)</text>
    <text x="24" y="449" font-size="13">No inference between dots. Software departure does not establish launch, causation, or scoring.</text>
  </g>
</svg>
