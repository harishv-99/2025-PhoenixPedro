//
// build.gradle in TeamCode
//
// Most of the definitions for building your module reside in a common, shared
// file 'build.common.gradle'. Being factored in this way makes it easier to
// integrate updates to the FTC into your code. If you really need to customize
// the build definitions, you can place those customizations in this file, but
// please think carefully as to whether such customizations are really necessary
// before doing so.

import org.gradle.external.javadoc.JavadocMemberLevel


// Custom definitions may go here

// Include common definitions from above.
apply from: '../build.common.gradle'
apply from: '../build.dependencies.gradle'

android {
    namespace = 'org.firstinspires.ftc.teamcode'

    packagingOptions {
        jniLibs.useLegacyPackaging true
    }
}

dependencies {
    implementation project(':FtcRobotController')

    testImplementation 'junit:junit:4.13.2'
}

def sushiAndroidComponents = androidComponents
sushiAndroidComponents.onVariants(
        sushiAndroidComponents.selector().withName('debug')) { variant ->
    tasks.register('sushiJavadocs', Javadoc) {
        group = 'documentation'
        description = 'Generates strict API documentation for the Sushi framework.'

        source(variant.sources.java.all)
        include('edu/ftcsushi/fw/**/*.java')
        include('edu/ftcsushi/robots/examples/**/*.java')
        classpath = files(
                variant.compileClasspath,
                sushiAndroidComponents.sdkComponents.bootClasspath)
        destinationDir = rootProject.layout.buildDirectory.dir('docs-site/api').get().asFile
        failOnError = true

        options.memberLevel = JavadocMemberLevel.PROTECTED
        options.encoding = 'UTF-8'
        options.charSet = 'UTF-8'
        options.docEncoding = 'UTF-8'
        options.windowTitle = 'Sushi Framework API'
        options.docTitle = 'Sushi Framework API'
        options.noTimestamp = true
        options.group('Program & lifecycle', [
                'edu.ftcsushi.fw.core.lifecycle*',
                'edu.ftcsushi.fw.core.time*',
                'edu.ftcsushi.fw.core.debug*'])
        options.group('Values, sources & bindings', [
                'edu.ftcsushi.fw.core.source*',
                'edu.ftcsushi.fw.input*',
                'edu.ftcsushi.fw.haptic*',
                'edu.ftcsushi.fw.supervisor*'])
        options.group('Actuation, Plants & control', [
                'edu.ftcsushi.fw.actuation*',
                'edu.ftcsushi.fw.core.control*',
                'edu.ftcsushi.fw.core.hal*'])
        options.group('Tasks, outcomes & coordination', [
                'edu.ftcsushi.fw.task*'])
        options.group('Drive, geometry & spatial reasoning', [
                'edu.ftcsushi.fw.drive*',
                'edu.ftcsushi.fw.field*',
                'edu.ftcsushi.fw.spatial*',
                'edu.ftcsushi.fw.core.geometry*',
                'edu.ftcsushi.fw.core.math*'])
        options.group('Sensing, localization & vision', [
                'edu.ftcsushi.fw.sensing*',
                'edu.ftcsushi.fw.localization*'])
        options.group('FTC adapters, testing & tuning', [
                'edu.ftcsushi.fw.ftc*',
                'edu.ftcsushi.fw.tools*',
                'edu.ftcsushi.fw.core.color*'])
        options.group('Integrations & extension seams', [
                'edu.ftcsushi.fw.integrations*'])
        options.group('Maintained robot examples', [
                'edu.ftcsushi.robots.examples*'])
        options.addBooleanOption('Xdoclint:all,-missing', true)
        options.addBooleanOption('Werror', true)
    }
}
