name: Phoenix verification and documentation

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: docs-site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  framework:
    name: Verify Phoenix framework
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Verify TeamCode compilation and tests
        run: >-
          ./gradlew --console=plain
          :TeamCode:compileDebugJavaWithJavac
          :TeamCode:testDebugUnitTest

      - name: Upload failed-test reports
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: teamcode-test-reports
          path: |
            TeamCode/build/test-results/testDebugUnitTest
            TeamCode/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
          retention-days: 3

  documentation:
    name: Verify documentation artifact
    needs: framework
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install pinned documentation dependencies
        run: python -m pip install --requirement requirements-docs.txt

      - name: Verify documentation dependencies
        run: python -m pip check

      - name: Build narrative documentation
        run: python -m zensical build --clean --strict

      - name: Build framework API documentation
        run: ./gradlew --console=plain :TeamCode:phoenixJavadocs

      - name: Verify generated artifact
        shell: bash
        run: |
          set -euo pipefail

          site='build/docs-site'
          required_files=(
            "$site/index.html"
            "$site/search.json"
            "$site/api/index.html"
            "$site/api/search.js"
            "$site/api/type-search-index.js"
            "$site/api/member-search-index.js"
          )

          for required_file in "${required_files[@]}"; do
            if [[ ! -s "$required_file" ]]; then
              echo "Missing or empty generated documentation file: $required_file" >&2
              exit 1
            fi
          done

          grep --fixed-strings --ignore-case --quiet 'Phoenix' "$site/index.html"
          grep --fixed-strings --quiet 'api/' "$site/index.html"
          grep --fixed-strings --quiet 'Phoenix' "$site/search.json"
          grep --fixed-strings --quiet 'FtcRobotOpMode' "$site/api/type-search-index.js"

          if find "$site" -type l -print -quit | grep --quiet .; then
            echo 'The Pages artifact must not contain symbolic links.' >&2
            exit 1
          fi

      - name: Upload exact GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: github-pages
          path: build/docs-site
          retention-days: 1
          include-hidden-files: true

  deploy:
    name: Deploy trusted master artifact
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master' &&
      github.repository == 'harishv-99/2025-PhoenixPedro'
    needs:
      - framework
      - documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Refuse to deploy a stale master artifact
        shell: bash
        run: |
          set -euo pipefail

          latest_sha="$(git ls-remote --exit-code \
            "https://github.com/${GITHUB_REPOSITORY}.git" \
            refs/heads/master | awk '{print $1}')"
          if [[ "$latest_sha" != "$GITHUB_SHA" ]]; then
            echo "Refusing stale deployment: run=$GITHUB_SHA master=$latest_sha" >&2
            exit 1
          fi

      - name: Deploy exact verified artifact
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        with:
          artifact_name: github-pages
